name: "Terraform GCP Deployment"

on:
  push:
    branches:
      - feature/gcpBucketInActions

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v1
        with:
          terraform_version: v1.10.4

      # Write the GCP credentials stored in GitHub Secrets to a file
      - name: Create Google Cloud Credentials File
        run: |
          echo '${{ secrets.GCP_CREDENTIALS }}' > "$HOME/gcp-credentials.json"
          cat "$HOME/gcp-credentials.json"  # (Optional: Remove after verifying)

      # Export the credentials for Terraform
      - name: Set GOOGLE_APPLICATION_CREDENTIALS
        run: echo "GOOGLE_APPLICATION_CREDENTIALS=$HOME/gcp-credentials.json" >> $GITHUB_ENV

      # Verify that Terraform can read the credentials
      - name: Debug Credentials
        run: ls -lah $HOME/gcp-credentials.json

      - name: Initialize Terraform
        run: terraform init

      - name: Plan Terraform Changes
        run: terraform plan

      - name: Apply Terraform Configuration
        run: terraform apply -auto-approve
